services:
  - type: web
    name: Inventario-Epp-Version-2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: epp_inventory
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DNI_ENCRYPTION_KEY
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: JWT_EXPIRES_IN
        value: 24h
