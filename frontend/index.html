<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPP Control — Farmacias Peruanas</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="bi bi-shield-check"></i></div>
        <span>EPP Control</span>
      </div>
      <nav class="sidebar-nav" aria-label="Navegación">
        <a href="#/dashboard" class="nav-link" data-route="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a href="#/periodos" class="nav-link" data-route="periodos"><i class="bi bi-calendar3"></i><span>Períodos</span></a>
        <a href="#/inventario-limpio" class="nav-link" data-route="inventario-limpio"><i class="bi bi-check-circle"></i><span>EPP Limpio</span></a>
        <a href="#/inventario-sucio" class="nav-link" data-route="inventario-sucio"><i class="bi bi-arrow-repeat"></i><span>EPP Sucio</span></a>
        <a href="#/entregas" class="nav-link" data-route="entregas"><i class="bi bi-box-arrow-up"></i><span>Entregas</span></a>
        <a href="#/ingresos" class="nav-link" data-route="ingresos"><i class="bi bi-box-arrow-down"></i><span>Ingresos</span></a>
        <a href="#/devoluciones" class="nav-link" data-route="devoluciones"><i class="bi bi-arrow-return-left"></i><span>Devoluciones</span></a>
        <a href="#/trabajadores" class="nav-link" data-route="trabajadores"><i class="bi bi-people"></i><span>Trabajadores</span></a>
        <a href="#/consultas" class="nav-link" data-route="consultas"><i class="bi bi-search"></i><span>Consultas</span></a>
        <a href="#/mi-perfil" class="nav-link" data-route="mi-perfil"><i class="bi bi-person-circle"></i><span>Mi Perfil</span></a>
        <a href="#/perfil" class="nav-link admin-only" data-route="perfil"><i class="bi bi-person-gear"></i><span>Administración</span></a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <!-- Header -->
      <header class="main-header">
        <div class="header-title">
          <h1 id="viewTitle">Dashboard</h1>
          <p class="text-muted mb-0" id="viewSubtitle">Resumen del sistema de inventario</p>
        </div>
        <div class="header-actions" id="headerActions">
          <button class="btn-icon theme-toggle" id="themeToggle"><i class="bi bi-moon"></i></button>
          <div class="dropdown">
            <button class="btn-icon" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><i class="bi bi-person-circle"></i></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#/mi-perfil"><i class="bi bi-person-circle me-2"></i>Mi Perfil</a></li>
              <li><a class="dropdown-item admin-only" href="#/perfil"><i class="bi bi-people me-2"></i>Usuarios</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Salir</a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Vista SPA -->
      <div class="content-wrapper" id="viewContainer">
        <div class="loading-container">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </main>
  </div>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/router.js"></script>
  <script>
    /* Reload splash — simple spinner while SPA boots */
    (function() {
      var splash = document.createElement('div');
      splash.id = 'splashReload';
      splash.innerHTML =
        '<img src="/img/logo.svg" class="splash-reload-logo" alt="Farmacias Peruanas">' +
        '<div class="splash-reload-spinner"></div>' +
        '<div class="splash-reload-text">Cargando...</div>';
      document.body.appendChild(splash);
      requestAnimationFrame(function() { splash.classList.add('fp-visible'); });
      window.__dismissSplash = function() {
        splash.classList.add('fp-done');
        setTimeout(function() { splash.remove(); }, 400);
      };
    })();

    if (!Auth.requireAuth()) throw new Error('No auth');
    Layout.init();
    Router.init();

    /* Dismiss splash after SPA content loads */
    setTimeout(function() {
      if (window.__dismissSplash) window.__dismissSplash();
    }, 800);
  </script>
</body>
</html>
