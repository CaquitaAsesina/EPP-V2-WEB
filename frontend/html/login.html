<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Farmacias Peruanas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-blob b1"></div>
    <div class="login-blob b2"></div>
    <div class="login-blob b3"></div>

    <div class="login-card">
      <div class="logo-icon">
        <i class="bi bi-capsule"></i>
      </div>
      <h1>EPP <em>Control</em></h1>
      <p class="subtitle"><i class="bi bi-heart-pulse-fill" style="color:var(--primary);"></i> Farmacias Peruanas · Sistema de Control de Inventario EPP</p>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label-apple" for="username">Usuario</label>
          <div class="login-input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="username" class="form-input" required
              placeholder="Ingrese su usuario" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label-apple" for="password">Contraseña</label>
          <div class="login-input-wrap">
            <i class="bi bi-shield-lock"></i>
            <input type="password" id="password" class="form-input" required
              placeholder="Ingrese su contraseña" autocomplete="current-password">
          </div>
        </div>
        <div id="loginError" class="toast-apple toast-error" style="display:none;margin-bottom:16px;min-width:auto;max-width:100%;">
          <i class="bi bi-x-circle-fill"></i>
          <span class="toast-msg" id="loginErrorMsg"></span>
        </div>
        <button type="submit" id="loginBtn" class="btn-apple btn-primary" style="width:100%;padding:14px;font-size:15px;">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
        </button>
      </form>

      <div class="login-brand-tag">
        <i class="bi bi-capsule-pill"></i> Diseñado para el control total de tu inventario
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = '/index.html#/dashboard';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('loginError');
      const errorMsg = document.getElementById('loginErrorMsg');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Ingresando...';
      errorDiv.style.display = 'none';

      try {
        const data = await API.post('/auth/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });

        if (data.success) {
          if (typeof FX !== 'undefined') FX.showPop('¡Bienvenido!', 'bi-stars');
          Auth.login(data.data.token, data.data.user);
          if (typeof FX !== 'undefined') FX.wipeTo('/index.html#/dashboard', window.innerWidth / 2, window.innerHeight / 2);
          else window.location.href = '/index.html#/dashboard';
          return false;
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorDiv.style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión';
      }
      return false;
    }
  </script>
</body>
</html>
